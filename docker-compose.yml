services:

  mysql_db:
    image: mysql:8.0
    container_name: mysql_db

    environment:
      MYSQL_ROOT_PASSWORD: mySQL123
      MYSQL_DATABASE: scae

    ports:
     - "3307:3306"

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pmySQL123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile

    container_name: fastapi_api

    env_file:
      - ./backend/api/.env

    ports:
      - "8000:8000"

    depends_on:
      mysql_db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: web_frontend

    ports:
      - "80:80"

    depends_on:
      - api